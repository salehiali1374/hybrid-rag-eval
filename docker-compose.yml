services:
  api:
    build: .
    # Bound to localhost because the API has no authentication. Change it to expose the service.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env # copy .env.example to .env; optional, /health and /search need no LLM
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway" # to reach an Ollama running on the host
    volumes:
      - data:/data
      - hf:/hf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      # first start downloads the dataset and models and embeds the corpus
      start_period: 600s
    restart: unless-stopped

volumes:
  data:
  hf:
